name: Build MH Player APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 9.9.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.2'

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/mhplayer-release.keystore

      - name: Create local.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "keystore.storePassword=$KEYSTORE_PASSWORD" >> local.properties
          echo "keystore.keyAlias=$KEY_ALIAS" >> local.properties
          echo "keystore.keyPassword=$KEY_PASSWORD" >> local.properties

      - name: Build release APK
        run: gradle assembleRelease --console=plain --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mh-player-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Commit APK to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p releases
          cp app/build/outputs/apk/release/app-release.apk releases/MH-Player-v1.6.apk
          git add releases/MH-Player-v1.6.apk
          git diff --cached --quiet || git commit -m "Add Zeno Play v1.6 APK (arm64-v8a) [skip ci]"
          git push
