org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.parallel=false
android.useAndroidX=true
kotlin.code.style=official
# AGP 9 built-in Kotlin rejects kapt (Room annotation processor) — KSP has no
# 2.4.x release yet (latest 2.3.14), so use AGP's documented bypass until then:
# regular Kotlin 2.4.21 plugins (kotlin.android + kapt) instead of built-in.
android.builtInKotlin=false
android.newDsl=false
